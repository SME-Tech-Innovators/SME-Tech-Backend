spring:
  application:
    name: sme

  datasource:
    url: jdbc:postgresql://learnwiselydb.postgres.database.azure.com:5432/sme_operations_db?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60m

  async:
    executor:
      core-pool-size: 2
      max-pool-size: 5
      queue-capacity: 100

app:
  base-url: ${APP_BASE_URL}
  domain: ${APP_DOMAIN}
  # FRONTEND_BASE_URL preferred for Paystack callback defaults; falls back to FRONTEND_URL
  frontend-url: ${FRONTEND_BASE_URL:${FRONTEND_URL}}
  email:
    from: ${APP_EMAIL_FROM}
  aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      bucket: ${AWS_S3_BUCKET}
      default-folder: ${AWS_S3_DEFAULT_FOLDER:workspaces}
      base-url: ${AWS_S3_BASE_URL:}
      max-size-bytes: ${AWS_S3_MAX_SIZE_BYTES:5242880}
      upload-url-expiry-minutes: ${AWS_S3_UPLOAD_URL_EXPIRY_MINUTES:15}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sme-operations.netlify.app}

  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiry-minutes: 1440

  verification-token:
    ttl-hours: 24

  rate-limit:
    ip-max-attempts: 5
    email-max-attempts: 3
    window-minutes: 60
    block-duration-minutes: 60
    order-lookup-max-attempts: ${ORDER_LOOKUP_MAX_ATTEMPTS:30}

  slug:
    max-retries: 5
    min-length: 3
    max-length: 50
    reserved-keywords: admin,api,app,auth,dashboard,login,logout,register,signup,store,support,www,mail,static,assets,public,private,internal,system,root

  bcrypt:
    strength: 12

  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    platform-fee-percent: ${PAYSTACK_PLATFORM_FEE_PERCENT:0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  frontend-url: http://localhost:3000
  email:
    from: test@example.com
  aws:
    region: us-east-1
    access-key: test
    secret-key: test
    s3:
      bucket: test-bucket
      default-folder: workspaces
      base-url: https://test-bucket.s3.us-east-1.amazonaws.com
      max-size-bytes: 5242880
      upload-url-expiry-minutes: 15
  cors:
    allowed-origins: http://localhost:3000
  slug:
    reserved-keywords: admin,api,app,auth,store
  paystack:
    secret-key: sk_test_dummy
